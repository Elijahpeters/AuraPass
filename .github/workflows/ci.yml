name: AuraPass checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Rebuild the synthetic PDF fixture
        run: python tools/create_synthetic_course_form.py
      - name: Lint
        run: python -m ruff check aurapass app tools tests
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q aurapass app tools tests
