[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aurapass"
version = "0.1.0"
description = "Offline examination-access control prototype with PDF enrollment, face matching, SQLite records, and Proteus co-simulation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Peters Elijah Temidayo" }]
dependencies = [
  "opencv-python>=4.8,<5",
  "numpy>=1.24,<3",
  "Pillow>=10,<12",
  "pdfplumber>=0.11,<1",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]
facenet = ["deepface>=0.0.93,<1"]

[tool.setuptools.packages.find]
include = ["aurapass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
